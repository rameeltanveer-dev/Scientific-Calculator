<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator scientific">
        <input type="text" id="display" class="calculator-screen" value="0" disabled>
        
        <div class="calculator-keys">
            <button type="button" class="function" value="sin">sin</button>
            <button type="button" class="function" value="cos">cos</button>
            <button type="button" class="function" value="tan">tan</button>
            <button type="button" class="function" value="log">log</button>

            <button type="button" class="function" value="sqrt">&radic;</button>
            <button type="button" class="function" value="power">x²</button>
            <button type="button" class="function" value="pi">&pi;</button>
            <button type="button" class="function" value="e">e</button>

            <button type="button" class="clear" value="clear">AC</button>
            <button type="button" class="operator" value="divide">&divide;</button>
            <button type="button" class="operator" value="multiply">&times;</button>
            <button type="button" class="backspace" value="backspace">&larr;</button>

            <button type="button" value="7">7</button>
            <button type="button" value="8">8</button>
            <button type="button" value="9">9</button>
            <button type="button" class="operator" value="subtract">-</button>

            <button type="button" value="4">4</button>
            <button type="button" value="5">5</button>
            <button type="button" value="6">6</button>
            <button type="button" class="operator" value="add">+</button>

            <button type="button" value="1">1</button>
            <button type="button" value="2">2</button>
            <button type="button" value="3">3</button>
            <button type="button" class="sign-change" value="sign">+/-</button>

            <button type="button" value="0" class="zero-button">0</button>
            <button type="button" class="decimal" value=".">.</button>
            <button type="button" class="equal-sign" value="=">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
